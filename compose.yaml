services:
  limen:
    image: ghcr.io/rhnu/limen:latest
    platform: linux/amd64
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./config:/config:ro
      - ./data:/data:rw
      - ./logs:/logs:rw
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    pids_limit: 128
    mem_limit: 512m
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    # HTTP, storage and VM each have a 5s budget; logs share another 3s.
    stop_grace_period: 25s
    restart: unless-stopped
