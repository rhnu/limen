services:
  limen:
    image: ghcr.io/rhnu/limen:latest
    platform: linux/amd64
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data
    read_only: true
    cap_drop:
      - ALL
    # The entrypoint repairs permissions, then drops to UID/GID 10001.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges
    pids_limit: 128
    mem_limit: 512m
    # HTTP draining and VM shutdown each have a 5s application budget.
    stop_grace_period: 15s
    restart: unless-stopped
