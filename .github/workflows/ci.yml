name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install the repository toolchain
        run: rustup show
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install C build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential cmake pkg-config
      - name: Install Rusteward
        uses: rhnu/rusteward@main
      - name: Compile check
        run: cargo check --workspace --all-targets --locked
      - name: Format check
        run: cargo dev format --check --diff --locked
      - name: Lint
        run: cargo dev lint --locked --deny-warnings
      - name: Unit tests
        run: cargo test --workspace --lib --bins --locked

  markdown:
    name: Markdown
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: rvben/rumdl@v0
        with:
          version: "0.2.79"
          command: check
          report-type: annotations
          args: --deny-config-warnings

  image:
    name: Linux amd64 image
    runs-on: ubuntu-24.04
    needs: [rust, markdown]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build the runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          pull: true
          push: false
          load: true
          tags: limen:ci
          cache-from: type=gha,scope=limen-linux-amd64
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,scope=limen-linux-amd64,mode=max' || '' }}
