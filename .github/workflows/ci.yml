name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: max
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install the repository toolchain
        run: rustup show
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install C build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential cmake pkg-config
      - name: Install Rusteward
        uses: rhnu/rusteward@main
      - name: Compile check
        run: cargo check --workspace --all-targets --locked
      - name: Format check
        run: cargo dev format --check --diff --locked
      - name: Lint
        run: cargo dev lint --locked --deny-warnings
      - name: Regular tests
        run: cargo test --workspace --lib --bins --locked
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install library example build tools
        run: npm ci --ignore-scripts
      - name: Bundle the library example
        run: npm run build:examples
      - name: Bundled library example
        run: cargo run --locked -- test --config examples/libraries/server.toml --cases examples/libraries
      - name: Isolated boundary tests
        run: cargo xtask test --isolated

  script-types:
    name: JavaScript types
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install static checking tools
        run: npm ci --ignore-scripts
      - name: Check JavaScript and declaration contracts
        run: npm run check:types

  markdown:
    name: Markdown
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: rvben/rumdl@v0
        with:
          version: "0.2.79"
          command: check
          report-type: annotations
          args: --deny-config-warnings

  image:
    name: Linux amd64 image
    runs-on: ubuntu-24.04
    needs: [rust, script-types, markdown]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH_IMAGE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Set the image name
        id: image-name
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        if: env.PUBLISH_IMAGE == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the runtime image and publish on main push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          pull: true
          push: ${{ env.PUBLISH_IMAGE == 'true' }}
          tags: ${{ steps.image-name.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # A single manifest can be retained without deleting referenced attestations.
          provenance: false
          sbom: false
          cache-from: type=gha,scope=limen-linux-amd64
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,scope=limen-linux-amd64,mode=max' || '' }}
      - name: Delete old GHCR versions after a successful push
        if: env.PUBLISH_IMAGE == 'true'
        uses: actions/github-script@v9
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        with:
          script: |
            const ownerPath = context.payload.repository.owner.type === 'Organization'
              ? '/orgs/{owner}' : '/users/{owner}';
            const packagePath = `${ownerPath}/packages/{package_type}/{package_name}/versions`;
            const params = {
              owner: context.repo.owner,
              package_type: 'container',
              package_name: context.repo.repo.toLowerCase(),
            };
            // List before deleting so pagination cannot skip versions after removals.
            const versions = await github.paginate(`GET ${packagePath}`, {
              ...params, per_page: 100,
            });
            const latest = versions.find(version => version.metadata?.container?.tags.includes('latest'));
            if (!latest || latest.name !== process.env.IMAGE_DIGEST) {
              throw new Error('latest does not match the pushed digest; refusing to delete versions');
            }
            // Match the digest, not creation time: a repeated push can reuse an older version.
            for (const version of versions) {
              if (version.id === latest.id) continue;
              await github.request(`DELETE ${packagePath}/{package_version_id}`, {
                ...params, package_version_id: version.id,
              });
              core.info(`Deleted old container version ${version.id}`);
            }
