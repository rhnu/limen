nextest-version = "0.9.148"

[profile.isolated]
test-threads = 1
retries = 0
fail-fast = false
global-timeout = "15m"
slow-timeout = { period = "18s", terminate-after = 1, grace-period = "0s" }
leak-timeout = { period = "500ms", result = "fail" }

[[profile.isolated.overrides]]
filter = 'test(/^runtime\//)'
slow-timeout = { period = "12s", terminate-after = 1, grace-period = "0s" }
