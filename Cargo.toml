[package]
name = "limen"
default-run = "limen"
description = "A configurable Chat Completions gateway for personal and private-network use"
version.workspace = true
edition.workspace = true
publish.workspace = true

[workspace]
members = [".", "modules/config", "modules/script", "modules/chat"]
default-members = ["."]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
axum = { version = "0.8.9", default-features = false }
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage"] }
limen-config = { path = "modules/config" }
limen-script = { path = "modules/script" }
limen-chat = { path = "modules/chat" }
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rquickjs = { version = "0.14.0", features = ["futures", "loader"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }
sse-parse = "0.1.0"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt", "sync", "time", "macros", "net", "signal", "io-util"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "json"] }
url = "2.5.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"

[dependencies]
axum.workspace = true
clap.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
limen-config.workspace = true
limen-script.workspace = true
limen-chat.workspace = true
reqwest.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[lints]
workspace = true

[profile.release]
strip = "debuginfo"
lto = "thin"
codegen-units = 1
